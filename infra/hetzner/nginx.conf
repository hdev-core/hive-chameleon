limit_req_zone $binary_remote_addr zone=hive_chameleon_guest:10m rate=30r/m;

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  listen [::]:80;
  server_name hive-signer.cloverapis.xyz;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name hive-signer.cloverapis.xyz;

  ssl_certificate /etc/letsencrypt/live/hive-signer.cloverapis.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/hive-signer.cloverapis.xyz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Referrer-Policy no-referrer always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'self'; object-src 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self' https: wss:;" always;

  client_max_body_size 1m;
  root /srv/hive-chameleon;

  location = / {
    return 302 /game/;
  }

  location = /game {
    return 301 /game/;
  }

  location = /game/index.html {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location = /game/game-bootstrap.js {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location = /game/runtime-config.json {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location ~ ^/game/Build/.*\.js\.br$ {
    add_header Content-Encoding br;
    add_header Cache-Control "public, max-age=31536000, immutable";
    default_type application/javascript;
    try_files $uri =404;
  }

  location ~ ^/game/Build/.*\.wasm\.br$ {
    add_header Content-Encoding br;
    add_header Cache-Control "public, max-age=31536000, immutable";
    default_type application/wasm;
    try_files $uri =404;
  }

  location ~ ^/game/Build/.*\.data\.br$ {
    add_header Content-Encoding br;
    add_header Cache-Control "public, max-age=31536000, immutable";
    default_type application/octet-stream;
    try_files $uri =404;
  }

  location ~ ^/game/Build/.*\.js\.gz$ {
    add_header Content-Encoding gzip;
    add_header Cache-Control "public, max-age=31536000, immutable";
    default_type application/javascript;
    try_files $uri =404;
  }

  location ~ ^/game/Build/.*\.wasm\.gz$ {
    add_header Content-Encoding gzip;
    add_header Cache-Control "public, max-age=31536000, immutable";
    default_type application/wasm;
    try_files $uri =404;
  }

  location ~ ^/game/Build/.*\.data\.gz$ {
    add_header Content-Encoding gzip;
    add_header Cache-Control "public, max-age=31536000, immutable";
    default_type application/octet-stream;
    try_files $uri =404;
  }

  location ~ ^/game/Build/.*\.(js|wasm|data|br|gz)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /game/ {
    try_files $uri $uri/ =404;
  }

  location = /api/v1/auth/guest {
    limit_req zone=hive_chameleon_guest burst=10 nodelay;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /v2/ {
    proxy_pass http://127.0.0.1:7350;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /ws {
    proxy_pass http://127.0.0.1:7350;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 75s;
  }

  location = /v1/sign {
    proxy_pass https://127.0.0.1:7443;
    proxy_http_version 1.1;
    proxy_ssl_verify off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    return 404;
  }
}
