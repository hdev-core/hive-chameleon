name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify workspace
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run contracts:check

      - name: Audit npm dependencies
        run: npm run security:dependencies

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Scan the repository tree
        run: >-
          docker run
          --rm
          --volume "${{ github.workspace }}:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          dir /repo
          --no-banner
          --redact

  postgres-schema:
    name: PostgreSQL migrations and schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Run clean migration and schema tests
        run: npm run schema:check

  nakama-runtime:
    name: Nakama Go runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime/nakama
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: runtime/nakama/go.mod
          cache-dependency-path: runtime/nakama/go.sum

      - name: Verify source
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go test -race ./...

      - name: Build runtime-compatible image
        working-directory: .
        run: docker build -t hive-chameleon-nakama:ci runtime/nakama

  nakama-integration:
    name: NestJS to Nakama bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Exercise bridge integration
        run: npm run realtime:smoke
