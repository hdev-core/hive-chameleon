openapi: 3.1.0
info:
  title: Hive Chameleon Client API
  version: 0.1.0
  summary: Client-facing HTTP contract for the Unity clients and Next.js portal.
  description: |
    Draft client API for Hive Chameleon. Realtime lobby, matchmaking, and gameplay
    messages are owned by Nakama and are documented in the paired architecture
    document rather than this OpenAPI file.

    Operations tagged `x-maturity: conceptual` describe a future API shape only.
    They do not approve unresolved product, custody, payment-provider, resale,
    organizer, or gameplay rules.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: Relative client API base; deployment hostname is configuration.
tags:
  - name: Authentication
    description: Direct-Hive and Google game-session establishment.
  - name: Onboarding
    description: Disclosure, permanent username, and real-Hive-account provisioning.
  - name: Sessions
    description: Backend session lifecycle and Nakama credential handoff.
  - name: Players
    description: Player identity, profile, preferences, appearance, and claim state.
  - name: Rounds
    description: Retained operational round history and public-record projection.
  - name: Lobbies
    description: HTTP lobby reads and durable invitation support.
  - name: Social
    description: Friends, requests, blocks, invitations, and notifications.
  - name: Inventory
    description: Projected collectible inventory and off-chain loadout.
  - name: Commerce
    description: Shop, purchases, payments, and external checkout concepts.
  - name: Hive Actions
    description: Explicit player Hive transaction intents and signer results.
  - name: Tournaments
    description: Controlled tournaments and conceptual later organizer variants.
  - name: Maps
    description: Official/community maps, versions, assets, review, and distribution.
  - name: Showcases
    description: Map showcase drafts, Hive publication, and eligible votes.
  - name: Marketplace
    description: Conceptual P2 collectible transfer and resale interfaces.
  - name: Catalog
    description: Versioned client-facing character and cosmetic catalogs.
  - name: Operations
    description: Pollable status for accepted asynchronous client commands.
security:
  - bearerAuth: []
paths:
  /auth/hive/challenges:
    post:
      tags: [Authentication]
      operationId: createHiveLoginChallenge
      summary: Create a single-use direct-Hive login challenge
      x-priority: P0
      x-maturity: committed
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HiveChallengeRequest'
      responses:
        '201':
          description: Challenge created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HiveChallenge'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'
  /auth/hive/sessions:
    post:
      tags: [Authentication]
      operationId: createHiveSession
      summary: Verify a Hive challenge signature and establish a game session
      x-priority: P0
      x-maturity: committed
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HiveSessionRequest'
      responses:
        '201':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'
  /auth/google/exchange:
    post:
      tags: [Authentication, Onboarding]
      operationId: exchangeGoogleAuthorization
      summary: Exchange a validated Google OIDC authorization result
      description: |
        Google authenticates the game session; it is not a Hive signature. A known
        identity receives normal game tokens. A first-time identity receives a
        restricted onboarding token and next-step state without creating a player.
      x-priority: P0
      x-maturity: committed
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleExchangeRequest'
      responses:
        '200':
          description: Existing player session or pending onboarding session
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthTokens'
                  - $ref: '#/components/schemas/OnboardingSession'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'
  /auth/refresh:
    post:
      tags: [Sessions]
      operationId: refreshSession
      summary: Rotate the refresh credential and issue a new access token
      x-priority: P0
      x-maturity: committed
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Rotated credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
  /auth/session:
    delete:
      tags: [Sessions]
      operationId: revokeCurrentSession
      summary: Revoke the current game session
      x-priority: P0
      x-maturity: committed
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
  /realtime/session:
    post:
      tags: [Sessions]
      operationId: createRealtimeSession
      summary: Mint a short-lived scoped Nakama session token
      description: Requires a playable player and acknowledgment of the current permanent-public-record disclosure.
      x-priority: P0
      x-maturity: committed
      responses:
        '201':
          description: Realtime connection credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeSession'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '428':
          description: Current permanent-public-record disclosure acknowledgment is required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /disclosures/public-match/current:
    get:
      tags: [Onboarding]
      operationId: getCurrentPublicMatchDisclosure
      summary: Get the effective permanent-public-record disclosure
      x-priority: P0
      x-maturity: committed
      security:
        - bearerAuth: []
        - onboardingBearer: []
      responses:
        '200':
          description: Current disclosure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRecordDisclosure'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
  /disclosures/public-match/acknowledgments:
    post:
      tags: [Onboarding]
      operationId: acknowledgePublicMatchDisclosure
      summary: Acknowledge one disclosure version
      x-priority: P0
      x-maturity: committed
      security:
        - bearerAuth: []
        - onboardingBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisclosureAcknowledgmentRequest'
      responses:
        '201':
          description: Acknowledgment recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisclosureAcknowledgment'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /onboarding/hive-username/check:
    post:
      tags: [Onboarding]
      operationId: checkHiveUsername
      summary: Check whether a permanent Hive username is currently available
      x-priority: P0
      x-maturity: committed
      security:
        - onboardingBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HiveUsernameRequest'
      responses:
        '200':
          description: Current availability result; this is not a reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HiveUsernameAvailability'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'
  /onboarding/hive-username:
    put:
      tags: [Onboarding]
      operationId: confirmHiveUsername
      summary: Confirm the requested permanent Hive username
      x-priority: P0
      x-maturity: committed
      security:
        - onboardingBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HiveUsernameRequest'
      responses:
        '200':
          description: Username confirmed for the existing logical onboarding job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisioningStatus'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /onboarding/provisioning:
    post:
      tags: [Onboarding, Operations]
      operationId: startHiveAccountProvisioning
      summary: Start or resume the one logical Google-to-Hive provisioning job
      x-priority: P0
      x-maturity: committed
      security:
        - onboardingBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/OperationAccepted'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'
  /onboarding/provisioning/{provisioningId}:
    parameters:
      - $ref: '#/components/parameters/ProvisioningId'
    get:
      tags: [Onboarding]
      operationId: getProvisioningStatus
      summary: Get recoverable provisioning progress
      x-priority: P0
      x-maturity: committed
      security:
        - onboardingBearer: []
      responses:
        '200':
          description: Provisioning status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisioningStatus'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /operations/{operationId}:
    parameters:
      - $ref: '#/components/parameters/OperationId'
    get:
      tags: [Operations]
      operationId: getOperation
      summary: Get the current state of an asynchronous client operation
      x-priority: P0
      x-maturity: committed
      security:
        - bearerAuth: []
        - onboardingBearer: []
      responses:
        '200':
          description: Operation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /me:
    get:
      tags: [Players]
      operationId: getCurrentPlayer
      summary: Get the current player and profile summary
      x-priority: P0
      x-maturity: committed
      responses:
        '200':
          description: Current player
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentPlayer'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
  /me/preferences:
    put:
      tags: [Players]
      operationId: replacePreferences
      summary: Replace cross-platform player preferences
      x-priority: P0
      x-maturity: committed
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerPreferences'
      responses:
        '200':
          description: Saved preferences
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerPreferences'
        '412':
          $ref: '#/components/responses/PreconditionProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /me/platform-settings/{platform}:
    parameters:
      - name: platform
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ClientPlatform'
    get:
      tags: [Players]
      operationId: getPlatformSettings
      summary: Get sensitivity and control mappings for one client platform
      x-priority: P0
      x-maturity: committed
      responses:
        '200':
          description: Platform settings
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettings'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
    put:
      tags: [Players]
      operationId: replacePlatformSettings
      summary: Replace sensitivity and control mappings for one platform
      x-priority: P0
      x-maturity: committed
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformSettingsUpdate'
      responses:
        '200':
          description: Saved platform settings
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettings'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '412':
          $ref: '#/components/responses/PreconditionProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /me/appearance:
    put:
      tags: [Players]
      operationId: replaceLobbyAppearance
      summary: Replace the saved lobby appearance
      x-priority: P0
      x-maturity: committed
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerAppearance'
      responses:
        '200':
          description: Saved appearance
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerAppearance'
        '412':
          $ref: '#/components/responses/PreconditionProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /me/hive-account/claims:
    get:
      tags: [Players, Hive Actions]
      operationId: listCurrentPlayerClaims
      summary: List self-custody claim attempts for the current account
      x-priority: P0
      x-maturity: committed
      responses:
        '200':
          description: Claim history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HiveAccountClaim'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
    post:
      tags: [Players, Hive Actions, Operations]
      operationId: startHiveAccountClaim
      summary: Start transfer of the same Hive account to player control
      x-priority: P0
      x-maturity: committed
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HiveAccountClaimRequest'
      responses:
        '202':
          $ref: '#/components/responses/OperationAccepted'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'
  /me/hive-account/claims/{claimId}:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    get:
      tags: [Players, Hive Actions]
      operationId: getHiveAccountClaim
      summary: Get authority, key-destruction, and recovery-transition status
      x-priority: P0
      x-maturity: committed
      responses:
        '200':
          description: Claim state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HiveAccountClaim'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /players/search:
    get:
      tags: [Players, Social]
      operationId: searchPlayerByHiveUsername
      summary: Find an exact Hive username
      x-priority: P1
      x-maturity: planned
      parameters:
        - name: hiveUsername
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/HiveUsername'
      responses:
        '200':
          description: Exact result or empty result
          content:
            application/json:
              schema:
                type: array
                maxItems: 1
                items:
                  $ref: '#/components/schemas/PlayerSummary'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /players/{hiveUsername}:
    parameters:
      - $ref: '#/components/parameters/HiveUsernamePath'
    get:
      tags: [Players]
      operationId: getPlayerByHiveUsername
      summary: Get a public player profile
      x-priority: P0
      x-maturity: committed
      responses:
        '200':
          description: Player profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPlayerProfile'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /players/{hiveUsername}/rounds:
    parameters:
      - $ref: '#/components/parameters/HiveUsernamePath'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
    get:
      tags: [Players, Rounds]
      operationId: listPlayerRounds
      summary: List retained completed and aborted round history
      x-priority: P0
      x-maturity: committed
      responses:
        '200':
          description: Round history page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundPage'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
  /rounds/{roundId}:
    parameters:
      - $ref: '#/components/parameters/RoundId'
    get:
      tags: [Rounds]
      operationId: getRound
      summary: Get the authorized operational round result view
      x-priority: P0
      x-maturity: committed
      responses:
        '200':
          description: Round result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundDetail'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /rounds/{roundId}/public-record:
    parameters:
      - $ref: '#/components/parameters/RoundId'
    get:
      tags: [Rounds]
      operationId: getRoundPublicRecord
      summary: Get Hive publication, correction, invalidation, and reconciliation state
      x-priority: P0
      x-maturity: committed
      responses:
        '200':
          description: Public-record state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRoundRecord'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /lobbies:
    get:
      tags: [Lobbies]
      operationId: listPublicLobbies
      summary: Browse public lobby summaries
      description: Lobby mutation and matchmaking commands use the Nakama realtime interface.
      x-priority: P0
      x-maturity: committed
      parameters:
        - name: region
          in: query
          schema:
            type: string
            maxLength: 32
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Public lobbies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LobbyPage'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
  /lobbies/{lobbyId}:
    parameters:
      - $ref: '#/components/parameters/LobbyId'
    get:
      tags: [Lobbies]
      operationId: getLobby
      summary: Get a lobby summary visible to the current player
      x-priority: P0
      x-maturity: committed
      responses:
        '200':
          description: Lobby summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LobbySummary'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /me/reconnect:
    get:
      tags: [Lobbies, Sessions]
      operationId: getReconnectDescriptor
      summary: Discover a currently restorable lobby or match slot
      x-priority: P0
      x-maturity: committed
      responses:
        '200':
          description: Reconnect eligibility; `available` may be false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconnectDescriptor'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
  /lobbies/{lobbyId}/invitations:
    parameters:
      - $ref: '#/components/parameters/LobbyId'
    post:
      tags: [Lobbies, Social]
      operationId: createLobbyInvitation
      summary: Create a player, code, or link invitation
      x-priority: P1
      x-maturity: planned
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LobbyInvitationRequest'
      responses:
        '201':
          description: Invitation created; raw code is returned once when applicable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LobbyInvitation'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
  /lobby-invitations/accept:
    post:
      tags: [Lobbies, Social]
      operationId: acceptLobbyInvitation
      summary: Validate an invitation and return Nakama join context
      x-priority: P1
      x-maturity: planned
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LobbyInvitationAcceptanceRequest'
      responses:
        '200':
          description: Valid invitation context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LobbyJoinContext'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
  /friend-requests:
    get:
      tags: [Social]
      operationId: listFriendRequests
      summary: List inbound and outbound friend requests
      x-priority: P1
      x-maturity: planned
      responses:
        '200':
          description: Friend requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FriendRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
    post:
      tags: [Social]
      operationId: createFriendRequest
      summary: Send a friend request to an exact Hive username
      x-priority: P1
      x-maturity: planned
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FriendRequestCreate'
      responses:
        '201':
          description: Friend request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequest'
        '409':
          $ref: '#/components/responses/ConflictProblem'
  /friend-requests/{friendRequestId}:
    parameters:
      - $ref: '#/components/parameters/FriendRequestId'
    patch:
      tags: [Social]
      operationId: respondToFriendRequest
      summary: Accept or decline a pending friend request
      x-priority: P1
      x-maturity: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FriendRequestResponse'
      responses:
        '200':
          description: Updated friend request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequest'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
  /friends:
    get:
      tags: [Social]
      operationId: listFriends
      summary: List accepted friends and current safe presence summary
      x-priority: P1
      x-maturity: planned
      responses:
        '200':
          description: Friends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Friend'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
  /friends/{playerId}:
    parameters:
      - $ref: '#/components/parameters/PlayerId'
    delete:
      tags: [Social]
      operationId: removeFriend
      summary: Remove an accepted friendship
      x-priority: P1
      x-maturity: planned
      responses:
        '204':
          description: Friendship removed or already absent
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
  /blocks:
    get:
      tags: [Social]
      operationId: listBlocks
      summary: List players blocked by the current player
      x-priority: P1
      x-maturity: planned
      responses:
        '200':
          description: Blocked players
