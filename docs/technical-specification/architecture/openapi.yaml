components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived game API access token.
    onboardingBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Restricted token scoped to one verified Google external identity and onboarding job.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID retained across retries of the same logical command.
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from the current mutable resource representation.
      schema:
        type: string
    Cursor:
      name: cursor
