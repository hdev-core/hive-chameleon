  headers:
    ETag:
      description: Opaque representation version for optimistic concurrency.
      schema:
        type: string
    Location:
      description: URL of the created operation or resource.
      schema:
        type: string
        format: uri-reference
  responses:
    OperationAccepted:
      description: Asynchronous operation accepted
      headers:
        Location:
          $ref: '#/components/headers/Location'
        Retry-After:
          description: Suggested minimum polling delay in seconds.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Operation'
    UnauthorizedProblem:
      description: Authentication is missing, invalid, expired, or revoked
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ForbiddenProblem:
      description: The authenticated player is not allowed to perform this action
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFoundProblem:
      description: Resource not found or not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ConflictProblem:
      description: Domain state conflict or duplicate logical command
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionProblem:
      description: If-Match does not match the current representation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationProblem:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailableProblem:
      description: A required Hive, signer, custody, HAF, or game dependency is unavailable
      headers:
        Retry-After:
          description: Suggested retry delay in seconds.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ConceptualFeatureProblem:
      description: Conceptual endpoint is not enabled because its product contract is unresolved
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, requestId]
      example:
        type: /problems/domain-conflict
        title: Domain state conflict
        status: 409
        code: lobby_state_conflict
        detail: The lobby changed before the command was applied.
        requestId: 01900000-0000-7000-8000-000000000001
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: '^[a-z0-9_]+$'
        detail:
          type: string
        requestId:
          type: string
          format: uuid
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    HiveUsername:
      type: string
      minLength: 3
      maxLength: 16
      pattern: '^[a-z][a-z0-9.-]*[a-z0-9]$'
    HiveChallengeRequest:
      type: object
      additionalProperties: false
      required: [hiveUsername, platform]
      properties:
        hiveUsername:
          $ref: '#/components/schemas/HiveUsername'
        platform:
          $ref: '#/components/schemas/ClientPlatform'
    HiveChallenge:
      type: object
      additionalProperties: false
      required: [id, hiveUsername, challenge, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        hiveUsername:
          $ref: '#/components/schemas/HiveUsername'
        challenge:
          type: string
          description: Canonical backend-generated challenge text, not a secret.
        expiresAt:
          type: string
          format: date-time
    HiveSessionRequest:
      type: object
      additionalProperties: false
      required: [challengeId, hiveUsername, signingProvider, signature]
      properties:
        challengeId:
          type: string
          format: uuid
        hiveUsername:
          $ref: '#/components/schemas/HiveUsername'
        signingProvider:
          $ref: '#/components/schemas/ExternalSigningProvider'
        signature:
          type: string
          maxLength: 512
    GoogleExchangeRequest:
      type: object
      additionalProperties: false
      required: [authorizationCode, codeVerifier, redirectUri, platform]
      properties:
        authorizationCode:
          type: string
          maxLength: 4096
          writeOnly: true
        codeVerifier:
          type: string
          minLength: 43
          maxLength: 128
          writeOnly: true
        redirectUri:
          type: string
          format: uri
          maxLength: 2048
        platform:
          $ref: '#/components/schemas/ClientPlatform'
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 32
          maxLength: 2048
          writeOnly: true
    AuthTokens:
      type: object
      additionalProperties: false
      required: [kind, accessToken, refreshToken, accessTokenExpiresAt, sessionId, player]
      properties:
        kind:
          type: string
          const: authenticated
        accessToken:
          type: string
          format: password
          x-sensitive: true
        refreshToken:
          type: string
          format: password
          x-sensitive: true
        accessTokenExpiresAt:
          type: string
          format: date-time
        sessionId:
          type: string
          format: uuid
        player:
          $ref: '#/components/schemas/PlayerSummary'
    OnboardingSession:
      type: object
      additionalProperties: false
      required: [kind, onboardingToken, externalIdentityId, nextStep, expiresAt]
      properties:
        kind:
          type: string
          const: onboarding
        onboardingToken:
          type: string
          format: password
          x-sensitive: true
        externalIdentityId:
          type: string
          format: uuid
        nextStep:
          type: string
          enum: [acknowledge_disclosure, choose_username, provisioning_pending, provisioning_ready]
        provisioningId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
    RealtimeSession:
      type: object
      additionalProperties: false
      required: [nakamaToken, socketUrl, expiresAt]
      properties:
        nakamaToken:
          type: string
          format: password
          x-sensitive: true
        socketUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    PublicRecordDisclosure:
      type: object
      additionalProperties: false
      required: [version, contentSha256, title, body, effectiveAt, permanentFields]
      example:
        version: '2026-07-01'
        contentSha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        title: Permanent Hive match-summary record
        body: Published match summaries permanently expose the listed fields on Hive.
        effectiveAt: '2026-07-01T00:00:00Z'
        permanentFields:
          - hive_username
          - match_participation
          - role
          - score
          - outcome
          - aggregated_likes
      properties:
        version:
          type: string
          maxLength: 32
        contentSha256:
          $ref: '#/components/schemas/Sha256'
        title:
          type: string
        body:
          type: string
        effectiveAt:
          type: string
          format: date-time
        permanentFields:
          type: array
          items:
            type: string
            enum: [hive_username, match_participation, role, score, outcome, aggregated_likes]
    DisclosureAcknowledgmentRequest:
      type: object
      additionalProperties: false
      required: [disclosureVersion, contentSha256]
      properties:
        disclosureVersion:
          type: string
          maxLength: 32
        contentSha256:
          $ref: '#/components/schemas/Sha256'
    DisclosureAcknowledgment:
      type: object
      additionalProperties: false
      required: [id, disclosureVersion, acknowledgedAt]
      properties:
        id:
          type: string
          format: uuid
        disclosureVersion:
          type: string
        acknowledgedAt:
          type: string
          format: date-time
    HiveUsernameRequest:
      type: object
      additionalProperties: false
      required: [hiveUsername]
      properties:
        hiveUsername:
          $ref: '#/components/schemas/HiveUsername'
    HiveUsernameAvailability:
      type: object
      additionalProperties: false
      required: [hiveUsername, available, checkedAt, reservationCreated]
      properties:
        hiveUsername:
          $ref: '#/components/schemas/HiveUsername'
        available:
          type: boolean
        checkedAt:
          type: string
          format: date-time
        reservationCreated:
          type: boolean
          const: false
        unavailableReason:
          type: string
          enum: [invalid, exists_on_hive, pending_platform_job]
    ProvisioningStatus:
      type: object
      additionalProperties: false
      required: [id, requestedHiveUsername, state, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        requestedHiveUsername:
          $ref: '#/components/schemas/HiveUsername'
        state:
          type: string
          enum:
            - username_confirmed
            - keys_ready
            - account_creation_pending
            - account_created
            - rc_delegation_pending
            - rc_delegated
            - ready
            - retryable_failed
            - terminal_failed
        safeFailureCode:
          type: string
        retryAfter:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Operation:
      type: object
      additionalProperties: false
      required: [id, type, state, createdAt, updatedAt]
      example:
        id: 01900000-0000-7000-8000-000000000002
        type: google_provisioning
        state: waiting_for_hive
        resource:
          type: hive_account_provisioning
          id: 01900000-0000-7000-8000-000000000003
          href: /onboarding/provisioning/01900000-0000-7000-8000-000000000003
        createdAt: '2026-07-12T09:30:00Z'
        updatedAt: '2026-07-12T09:30:05Z'
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - google_provisioning
            - hive_account_claim
            - hive_transaction
            - cosmetic_purchase
            - tournament_entry
            - showcase_publish
            - showcase_vote
            - map_submission
            - collectible_transfer
            - marketplace_listing
            - marketplace_order
            - fiat_checkout
        state:
          type: string
          enum: [pending, in_progress, waiting_for_player, waiting_for_hive, succeeded, failed, cancelled]
        resource:
          $ref: '#/components/schemas/ResourceReference'
        safeErrorCode:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ResourceReference:
      type: object
      additionalProperties: false
      required: [type, id, href]
      properties:
        type:
          type: string
        id:
          type: string
        href:
          type: string
          format: uri-reference
    PlayerSummary:
      type: object
      additionalProperties: false
      required: [id, hiveUsername]
      properties:
        id:
          type: string
          format: uuid
        hiveUsername:
          $ref: '#/components/schemas/HiveUsername'
        displayName:
          type: string
          maxLength: 128
        avatarUrl:
          type: string
          format: uri
    CurrentPlayer:
      type: object
      additionalProperties: false
      required: [id, hiveUsername, hiveControlState, disclosureAcknowledged, profile, preferences, appearance]
      properties:
        id:
          type: string
          format: uuid
        hiveUsername:
          $ref: '#/components/schemas/HiveUsername'
        displayName:
          type: string
          maxLength: 128
        avatarUrl:
          type: string
          format: uri
        hiveControlState:
          type: string
          enum: [external_self_custodial, platform_custodial, authority_claimed_recovery_pending, self_custody_complete]
        disclosureAcknowledged:
          type: boolean
        profile:
          $ref: '#/components/schemas/PublicPlayerProfile'
        preferences:
          $ref: '#/components/schemas/PlayerPreferences'
        appearance:
          $ref: '#/components/schemas/PlayerAppearance'
    PublicPlayerProfile:
      type: object
      additionalProperties: false
      required: [player, statistics, achievements, recentRounds]
      properties:
        player:
          $ref: '#/components/schemas/PlayerSummary'
        statistics:
          type: array
          items:
            $ref: '#/components/schemas/ModeStatistics'
        achievements:
          type: array
          items:
            $ref: '#/components/schemas/Achievement'
        recentRounds:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/RoundSummary'
    PlayerPreferences:
      type: object
      additionalProperties: false
      required: [streamerMode, uiScale, colorblindMode, masterVolume, effectsVolume, interfaceVolume]
      properties:
        streamerMode:
          type: boolean
        uiScale:
          type: number
          minimum: 0.5
          maximum: 2
        colorblindMode:
          type: string
          enum: [none, protanopia, deuteranopia, tritanopia]
        masterVolume:
          type: number
          minimum: 0
          maximum: 1
        effectsVolume:
          type: number
          minimum: 0
          maximum: 1
        interfaceVolume:
          type: number
          minimum: 0
          maximum: 1
        crosshairConfig:
          type: object
          additionalProperties: true
    PlatformSettings:
      type: object
      additionalProperties: false
      required: [platform, controlMapping]
      properties:
        platform:
          $ref: '#/components/schemas/ClientPlatform'
        mouseSensitivity:
          type: number
          exclusiveMinimum: 0
        controllerSensitivity:
          type: number
          exclusiveMinimum: 0
        controlMapping:
          type: object
          additionalProperties: true
    PlatformSettingsUpdate:
      type: object
      additionalProperties: false
      required: [controlMapping]
      properties:
        mouseSensitivity:
          type: number
          exclusiveMinimum: 0
        controllerSensitivity:
          type: number
          exclusiveMinimum: 0
        controlMapping:
          type: object
          additionalProperties: true
    PlayerAppearance:
      type: object
      additionalProperties: false
      required: [characterForm, sizePreset, lobbyPoseCode, formatVersion]
      properties:
        characterForm:
          type: string
          enum: [humanoid, cube]
        sizePreset:
          type: string
          enum: [x1_0, x1_4, x1_7]
        lobbyPoseCode:
          type: string
          maxLength: 64
        paintArtifactId:
          type: string
          format: uuid
        formatVersion:
          type: integer
          minimum: 1
    ModeStatistics:
      type: object
      additionalProperties: false
      required: [mode, roundsPlayed, hunterWins, hiderWins, discoveries, timesSurvived, aggregateScore]
      properties:
        mode:
          type: string
          enum: [casual, infection]
        roundsPlayed:
          type: integer
          minimum: 0
        hunterWins:
          type: integer
          minimum: 0
        hiderWins:
          type: integer
          minimum: 0
        discoveries:
          type: integer
          minimum: 0
        timesSurvived:
          type: integer
          minimum: 0
        aggregateScore:
          type: string
          pattern: '^-?[0-9]+\.[0-9]{4}$'
    Achievement:
      type: object
      additionalProperties: false
      required: [code, displayName, status, progress]
      properties:
        code:
          type: string
        displayName:
          type: string
        status:
          type: string
          enum: [in_progress, earned]
        progress:
          type: string
        earnedAt:
          type: string
          format: date-time
    HiveAccountClaimRequest:
      type: object
      additionalProperties: false
      required: [ownerAuthority, activeAuthority, postingAuthority, memoPublicKey, recoveryAccount, confirmation]
      properties:
        ownerAuthority:
          $ref: '#/components/schemas/PublicHiveAuthority'
        activeAuthority:
          $ref: '#/components/schemas/PublicHiveAuthority'
        postingAuthority:
          $ref: '#/components/schemas/PublicHiveAuthority'
        memoPublicKey:
          type: string
          maxLength: 64
        recoveryAccount:
          $ref: '#/components/schemas/HiveUsername'
        confirmation:
          type: boolean
          const: true
    PublicHiveAuthority:
      type: object
      additionalProperties: false
      required: [weightThreshold, keyAuths, accountAuths]
      properties:
        weightThreshold:
          type: integer
          minimum: 1
        keyAuths:
          type: array
          items:
            $ref: '#/components/schemas/WeightedHiveKey'
        accountAuths:
          type: array
          items:
            $ref: '#/components/schemas/WeightedHiveAccount'
    WeightedHiveKey:
      type: object
      additionalProperties: false
      required: [publicKey, weight]
      properties:
        publicKey:
          type: string
          maxLength: 64
        weight:
          type: integer
          minimum: 1
    WeightedHiveAccount:
      type: object
      additionalProperties: false
      required: [account, weight]
      properties:
        account:
          $ref: '#/components/schemas/HiveUsername'
        weight:
          type: integer
          minimum: 1
    HiveAccountClaim:
      type: object
      additionalProperties: false
      description: |
        Claim transfers the same Hive account without exporting old custodial keys.
        Authority rotation and key destruction do not complete the claim: Hive keeps
        the prior recovery account effective during its 30-day delay. The resource
        reaches `self_custody_complete` only after the requested recovery account is
        effective and verified from Hive history/current account state.
      required: [id, state, recoveryAccount, requestedAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [requested, authority_rotation_pending, custody_destruction_pending, recovery_change_pending, self_custody_complete, retryable_failed, terminal_failed]
        recoveryAccount:
          $ref: '#/components/schemas/HiveUsername'
        authorityRotationIrreversibleAt:
          type: string
          format: date-time
        custodialSigningDisabledAt:
          type: string
          format: date-time
        keyDestructionCompletedAt:
          type: string
          format: date-time
        recoveryEffectiveExpectedAt:
          type: string
          format: date-time
        recoveryEffectiveAt:
          type: string
          format: date-time
        safeFailureCode:
          type: string
        requestedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RoundPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoundSummary'
        page:
          $ref: '#/components/schemas/PageMetadata'
    RoundSummary:
      type: object
      additionalProperties: false
      required: [id, mode, mapVersionId, status, startedAt]
      properties:
        id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [casual, infection]
        mapVersionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [completed, aborted]
        winningSide:
          type: string
          enum: [hiders, hunters, none]
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        publicRecordState:
          type: string
          enum: [not_eligible, queued, included, irreversible, corrected, invalidated, divergent]
    RoundDetail:
      oneOf:
        - $ref: '#/components/schemas/CompletedRoundDetail'
        - $ref: '#/components/schemas/AbortedRoundDetail'
      discriminator:
        propertyName: status
        mapping:
          completed: '#/components/schemas/CompletedRoundDetail'
          aborted: '#/components/schemas/AbortedRoundDetail'
    CompletedRoundDetail:
      type: object
      additionalProperties: false
      required: [id, mode, mapVersionId, status, startedAt, resultSchemaVersion, scoringRuleVersion, participants, discoveries, likes]
      properties:
        id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [casual, infection]
        mapVersionId:
          type: string
          format: uuid
        status:
          type: string
          const: completed
        winningSide:
          type: string
          enum: [hiders, hunters, none]
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        publicRecordState:
          type: string
          enum: [not_eligible, queued, included, irreversible, corrected, invalidated, divergent]
        resultSchemaVersion:
          type: string
        scoringRuleVersion:
          type: string
        canonicalResultSha256:
          $ref: '#/components/schemas/Sha256'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/RoundParticipant'
        discoveries:
          type: array
          items:
            $ref: '#/components/schemas/RoundDiscovery'
        likes:
          type: array
          items:
            $ref: '#/components/schemas/RoundLikeSummary'
    AbortedRoundDetail:
      type: object
      additionalProperties: false
      required: [id, mode, mapVersionId, status, startedAt, endedAt, abortReason]
      properties:
        id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [casual, infection]
        mapVersionId:
          type: string
          format: uuid
        status:
          type: string
          const: aborted
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        abortReason:
          type: string
          maxLength: 512
        publicRecordState:
          type: string
          const: not_eligible
    RoundParticipant:
      type: object
      additionalProperties: false
      required: [player, initialRole, finalRole, outcome, score]
      properties:
        player:
          $ref: '#/components/schemas/PlayerSummary'
        initialRole:
          type: string
          enum: [hider, hunter]
        finalRole:
          type: string
          enum: [hider, hunter]
        outcome:
          type: string
        score:
          type: string
          pattern: '^-?[0-9]+\.[0-9]{4}$'
    RoundDiscovery:
      type: object
      additionalProperties: false
      required: [hunterHiveUsername, hiderHiveUsername, occurredAt]
      properties:
        hunterHiveUsername:
          $ref: '#/components/schemas/HiveUsername'
        hiderHiveUsername:
          $ref: '#/components/schemas/HiveUsername'
        occurredAt:
          type: string
          format: date-time
    RoundLikeSummary:
      type: object
      additionalProperties: false
      required: [hiderHiveUsername, received]
      properties:
        hiderHiveUsername:
          $ref: '#/components/schemas/HiveUsername'
        received:
          type: integer
          minimum: 0
    PublicRoundRecord:
      type: object
      additionalProperties: false
      required: [roundId, state, reconciliationState]
      example:
        roundId: 01900000-0000-7000-8000-000000000004
        state: irreversible
        eventId: 01900000-0000-7000-8000-000000000005
