name: hive-chameleon-nakama

services:
  postgres:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: ${NAKAMA_DATABASE_PASSWORD:?set NAKAMA_DATABASE_PASSWORD}
      POSTGRES_USER: nakama
    healthcheck:
      test: [CMD-SHELL, pg_isready -U nakama -d nakama]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - nakama-postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
    entrypoint: [/nakama/nakama]
    command:
      - migrate
      - up
      - --database.address
      - nakama:${NAKAMA_DATABASE_PASSWORD}@postgres:5432/nakama
    depends_on:
      postgres:
        condition: service_healthy
    restart: no

  nakama:
    build:
      context: .
    command:
      - --config
      - /nakama/data/local.yml
      - --database.address
      - nakama:${NAKAMA_DATABASE_PASSWORD}@postgres:5432/nakama
      - --socket.server_key
      - ${NAKAMA_SERVER_KEY:?set NAKAMA_SERVER_KEY}
      - --runtime.http_key
      - ${NAKAMA_RUNTIME_HTTP_KEY:?set NAKAMA_RUNTIME_HTTP_KEY}
      - --runtime.env
      - NAKAMA_BRIDGE_HMAC_KEY=${NAKAMA_BRIDGE_HMAC_KEY:?set NAKAMA_BRIDGE_HMAC_KEY}
      - --session.encryption_key
      - ${NAKAMA_SESSION_ENCRYPTION_KEY:?set NAKAMA_SESSION_ENCRYPTION_KEY}
      - --session.refresh_encryption_key
      - ${NAKAMA_REFRESH_ENCRYPTION_KEY:?set NAKAMA_REFRESH_ENCRYPTION_KEY}
      - --console.username
      - ${NAKAMA_CONSOLE_USERNAME:?set NAKAMA_CONSOLE_USERNAME}
      - --console.password
      - ${NAKAMA_CONSOLE_PASSWORD:?set NAKAMA_CONSOLE_PASSWORD}
      - --console.signing_key
      - ${NAKAMA_CONSOLE_SIGNING_KEY:?set NAKAMA_CONSOLE_SIGNING_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /nakama/nakama, healthcheck]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - '127.0.0.1:${NAKAMA_API_PORT:-7350}:7350'
      - '127.0.0.1:${NAKAMA_CONSOLE_PORT:-7351}:7351'
      - '127.0.0.1:${NAKAMA_METRICS_PORT:-7354}:7354'
    volumes:
      - ./local.yml:/nakama/data/local.yml:ro

volumes:
  nakama-postgres-data:
